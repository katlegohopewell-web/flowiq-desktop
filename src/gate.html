<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Activate — FlowIQ</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F2A4A; --panel:#14355C; --field:#0C2440; --line:#2F5680;
    --cyan:#6FC3E8; --text:#DCEAF5; --muted:#7FA0BE; --amber:#E3A857; --bad:#E38A8A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:
      linear-gradient(var(--bg), var(--bg)),
      repeating-linear-gradient(0deg, rgba(111,195,232,0.06) 0px, rgba(111,195,232,0.06) 1px, transparent 1px, transparent 32px),
      repeating-linear-gradient(90deg, rgba(111,195,232,0.06) 0px, rgba(111,195,232,0.06) 1px, transparent 1px, transparent 32px);
    color:var(--text); font-family:'IBM Plex Sans',sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  .card{
    width:420px; background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:32px 30px; text-align:center;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--cyan); margin-bottom:8px;
  }
  h1{ font-family:'Space Grotesk',sans-serif; font-size:22px; margin:0 0 6px; }
  .sub{ color:var(--muted); font-size:13px; margin:0 0 24px; line-height:1.5; }
  input{
    width:100%; background:var(--field); border:1px solid var(--line); border-radius:8px;
    color:var(--text); padding:12px 14px; font-family:'IBM Plex Mono',monospace; font-size:15px;
    text-align:center; letter-spacing:0.05em; text-transform:uppercase; outline:none;
  }
  input:focus{ border-color:var(--cyan); }
  input::placeholder{ color:var(--muted); text-transform:none; letter-spacing:normal; }
  button{
    width:100%; margin-top:14px; background:var(--cyan); color:#08243F; border:none;
    border-radius:8px; padding:12px; font-family:'IBM Plex Mono',monospace; font-size:14px;
    font-weight:600; cursor:pointer;
  }
  button:hover{ background:#8FD4F2; }
  button:disabled{ opacity:0.5; cursor:default; }
  .status{ margin-top:16px; font-size:13px; min-height:18px; }
  .status.ok{ color:#7FD4A6; }
  .status.err{ color:var(--bad); }
  .status.pending{ color:var(--muted); }
  .footer-note{ margin-top:22px; font-size:11.5px; color:var(--muted); line-height:1.5; }
  .footer-note a{ color:var(--cyan); text-decoration:none; }
</style>
</head>

    <div class="eyebrow">FlowIQ — Stormwater Runoff Calculator</div>
    <h1>Enter your license key</h1>
    <p class="sub">A subscription is required to run calculations. Enter the key you received when you subscribed.</p>
    <input id="keyInput" type="text" placeholder="STRM-XXXX-XXXX-XXXX" autofocus>
    <button id="activateBtn">Activate</button>
    <div class="status" id="status"></div>
    <p class="footer-note">Need a license or having trouble activating?<br>Contact your subscription provider for support.</p>
  </div>

  <script>
    const input = document.getElementById('keyInput');
    const btn = document.getElementById('activateBtn');
    const statusEl = document.getElementById('status');

    function setStatus(msg, cls){
      statusEl.textContent = msg;
      statusEl.className = 'status ' + (cls || '');
    }

    async function doActivate(){
      const key = input.value.trim();
      if(!key){ setStatus('Enter a license key', 'err'); return; }
      btn.disabled = true;
      setStatus('Checking…', 'pending');
      try {
        const result = await window.licenseAPI.activate(key);
        if(result.valid){
          setStatus('Activated — loading calculator…', 'ok');
          setTimeout(() => window.licenseAPI.enterApp(), 500);
        } else {
          setStatus(result.message || 'Invalid key', 'err');
        }
      } catch(e){
        setStatus('Something went wrong. Try again.', 'err');
      }
      btn.disabled = false;
    }

    btn.addEventListener('click', doActivate);
    input.addEventListener('keydown', e => { if(e.key === 'Enter') doActivate(); });
  </script>
</body>
